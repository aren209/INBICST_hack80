[project]
name = "mipt-regulations-navigator"
version = "0.1.0"
description = "Hierarchical chunking, OCR, local embeddings and Qdrant Hybrid Search for MIPT internal regulations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pymorphy3>=2.0.0",
    "razdel>=0.5.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "streamlit>=1.36.0,<2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

