  "посвящение": ["Посвящение в студенты", "репетиционные дни", "физтех-школа", "КЗ"]
  "общага": ["общежитие", "поселение сотрудников", "жилое помещение", "найм"]
  "общежитие": ["поселение сотрудников", "жилое помещение", "договор найма", "комиссия"]
