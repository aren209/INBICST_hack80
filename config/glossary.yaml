  "командировка": ["командирование", "суточные", "авансовый отчет", "проезд", "проживание"]
  "техподдержка": ["первая линия технической поддержки", "заявка", "инцидент", "УИТ"]
  "серверная": ["центр обработки данных", "ЦОД", "стойка", "доступ в ЦОД", "оборудование"]
  "вакансия": ["поиск и подбор персонала", "рекрутер", "резюме", "кандидат", "заявка на подбор"]

# 12 обязательных паттернов ответственных ролей (ROLE_PATTERNS)
role_patterns:
  "инициатор": '(?i)\b(?:инициатор[а-яё]*|заявител[ьяюемИ]+)\b'
  "организатор": '(?i)\b(?:организатор[а-яё]*|ответственн[а-яё]+\s+за\s+(?:проведение|организацию|мероприятие))\b'
  "руководитель подразделения / ЦФО": '(?i)\b(?:руководител[ьяюеми]+\s+(?:структурного\s+)?(?:подразделения|ЦФО|проекта|темы|гранта|физтех-школы|лаборатории|отдела)|директор[а-яё]*\s+физтех-школ[а-яё]*)\b'
  "финансодержатель": '(?i)\b(?:финансодержател[ьяюеми]+|держател[ьяюеми]+\s+ФЛС)\b'
  "начальник отдела (ПФО, КМО, УИТ и др.)": '(?i)\b(?:начальник[а-яё]*\s+(?:отдела|управления|ПФО|КМО|УИТ|ФЭУ|ОТиТБ|службы)|руководител[ьяюеми]+\s+(?:ПФО|КМО|УИТ|ФЭУ))\b'
  "бухгалтерия": '(?i)\b(?:бухгалтери[яиейю]|главн[а-яё]+\s+бухгалтер[а-яё]*|УБУиФК|финансово-экономическ[а-яё]+\s+управлени[а-яё]+)\b'
  "дирекция": '(?i)\b(?:дирекци[яиейю]|директор[а-яё]*\s+по\s+[а-яё\s]+|исполнительн[а-яё]+\s+дирекци[яиейю])\b'
  "проректор": '(?i)\b(?:проректор[а-яё]*|перв[а-яё]+\s+проректор[а-яё]*|ректор[а-яё]*)\b'
  "администратор / техспециалист": '(?i)\b(?:администратор[а-яё]*|техническ[а-яё]+\s+специалист[а-яё]*|специалист[а-яё]*\s+(?:первой\s+линии|техподдержки|ЦОД|КЗ)|оператор[а-яё]*|дежурн[а-яё]+\s+инженер[а-яё]*|звукорежиссер[а-яё]*|художник[а-яё]*\s+по\s+свету)\b'
  "комендант / управление кампусом": '(?i)\b(?:комендант[а-яё]*|заведующ[а-яё]+\s+общежити[а-яё]+|управлени[еяю]\s+(?:кампусом|общежитиями|жилым\s+фондом)|жилищн[а-яё]+\s+комисси[яиейю]|паспортист[а-яё]*)\b'
  "кадровая служба / рекрутер": '(?i)\b(?:кадров[а-яё]+\s+служб[а-яё]+|отдел[а-яё]*\s+(?:кадров|подбора\s+персонала)|управлени[еяю]\s+по\s+работе\s+с\s+персоналом|рекрутер[а-яё]*|специалист[а-яё]*\s+по\s+подбору)\b'
  "согласующее лицо": '(?i)\b(?:согласующ[а-яё]+\s+лиц[оауе]|лист\s+согласования|визирующ[а-яё]+|эксперт[а-яё]*\s+согласования)\b'

