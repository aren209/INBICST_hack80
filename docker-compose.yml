services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: mipt_rag_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped

  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mipt_rag_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./доки:/app/доки
      - ./data:/app/data
      - ./config:/app/config
    depends_on:
      - qdrant
    restart: unless-stopped
